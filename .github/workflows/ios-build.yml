
name: iOS Build - CyberPulseUso.Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'CyberPulseUso.Mobile/**'
      - 'CyberPulseUso.Shared/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build MAUI iOS
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Restore dependencies
        run: dotnet restore CyberPulseUso.Mobile/CyberPulseUso.Mobile.csproj
        
      - name: Build iOS (unsigned)
        run: >
          dotnet build CyberPulseUso.Mobile/CyberPulseUso.Mobile.csproj
          -f net10.0-ios
          -c Release
          -p:BuildIpa=false
          -p:EnableCodeSigning=false
          --no-restore
