
name: iOS Build - CyberPulseUso.Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'CyberPulseUso.Mobile/**'
      - 'CyberPulseUso.Shared/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build MAUI iOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.401

      - name: Restore iOS dependencies
        run: >
          dotnet restore CyberPulseUso.Mobile/CyberPulseUso.Mobile.csproj
          -p:TargetFrameworks=net10.0-ios
          -p:RestoreProjectReferences=false
          -r ios-arm64
          
      - name: Restore Shared dependencies
        run: dotnet restore CyberPulseUso.Shared/CyberPulseUso.Shared.csproj --force --no-cache -p:TargetFramework=net10.0

      - name: Build Shared
        run: dotnet build CyberPulseUso.Shared/CyberPulseUso.Shared.csproj -c Release --no-restore

      - name: Verify Shared assets
        run: |
          dotnet --version
          grep -q '"net10.0"' CyberPulseUso.Shared/obj/project.assets.json
          echo "Shared: dependencia net10.0 encontrada."

      - name: Build iOS device (unsigned)
        run: >
          dotnet build CyberPulseUso.Mobile/CyberPulseUso.Mobile.csproj
          -f net10.0-ios
          -c Release
          -p:TargetFrameworks=net10.0-ios
          -p:RuntimeIdentifier=ios-arm64
          -p:BuildProjectReferences=false
          -p:BuildIpa=false
          -p:EnableCodeSigning=false
          --no-restore
