
name: iOS Build - CyberPulseUso.Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'CyberPulseUso.Mobile/**'
      - 'CyberPulseUso.Shared/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build MAUI iOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.401

      - name: Restore iOS dependencies
        run: >
          dotnet restore CyberPulseUso.Mobile/CyberPulseUso.Mobile.csproj
          -p:TargetFrameworks=net10.0-ios
          -p:RestoreProjectReferences=false
          -r ios-arm64
          
      - name: Restore Shared dependencies
        run: dotnet restore CyberPulseUso.Shared/CyberPulseUso.Shared.csproj --force --no-cache -p:TargetFramework=net10.0

      - name: Build Shared
        run: dotnet build CyberPulseUso.Shared/CyberPulseUso.Shared.csproj -c Release --no-restore

      - name: Verify Shared assets
        run: |
          dotnet --version
          grep -q '"net10.0"' CyberPulseUso.Shared/obj/project.assets.json
          echo "Shared: dependencia net10.0 encontrada."


      - name: Publish iOS IPA (unsigned)
        run: >
          dotnet publish CyberPulseUso.Mobile/CyberPulseUso.Mobile.csproj
          -f net10.0-ios
          -c Release
          -p:TargetFrameworks=net10.0-ios
          -p:RuntimeIdentifier=ios-arm64
          -p:BuildProjectReferences=false
          -p:ArchiveOnBuild=true
          -p:EnableCodeSigning=false
          --no-restore

      - name: Verify IPA
        run: |
          find CyberPulseUso.Mobile/bin/Release/net10.0-ios/ios-arm64 -name "*.ipa" -print
          test -n "$(find CyberPulseUso.Mobile/bin/Release/net10.0-ios/ios-arm64 -name '*.ipa' -print -quit)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CyberPulseUso-iOS-unsigned
          path: CyberPulseUso.Mobile/bin/Release/net10.0-ios/ios-arm64/publish/*.ipa
          if-no-files-found: error

