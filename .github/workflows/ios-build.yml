
name: iOS Build - CyberPulseUso.Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'CyberPulseUso.Mobile/**'
      - 'CyberPulseUso.Shared/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build MAUI iOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.401


      - name: Restore Shared dependencies
        run: dotnet restore CyberPulseUso.Shared/CyberPulseUso.Shared.csproj

      - name: Build Shared
        run: dotnet build CyberPulseUso.Shared/CyberPulseUso.Shared.csproj -c Release --no-restore

      - name: Restore iOS dependencies
        run: dotnet restore CyberPulseUso.Mobile/CyberPulseUso.Mobile.csproj -p:TargetFrameworks=net10.0-ios -p:RestoreProjectReferences=false

      - name: Build iOS (unsigned)
        run: >
          dotnet build CyberPulseUso.Mobile/CyberPulseUso.Mobile.csproj
          -f net10.0-ios
          -c Release
          -p:TargetFrameworks=net10.0-ios
          -p:BuildProjectReferences=false
          -p:BuildIpa=false
          -p:EnableCodeSigning=false
          --no-restore
